name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile src/main.py api/index.py

      - name: Unit tests (core smoke)
        env:
          ORCH_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
          ORCH_MODEL: MiniMax/MiniMax-M2.5
          ORCH_API_KEY: dummy-key-for-ci
          ENABLE_CHECKPOINT: "true"
          CHECKPOINT_BACKEND: memory
        run: |
          pytest tests/test_intent.py tests/test_metrics.py tests/test_tracing.py -v

